# CI/CD для репозитория wayces-server (отдельный репо).
# Секреты: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, VPS_HOST, VPS_USER, VPS_SSH_PASSWORD (вход по паролю).
name: CI/CD

on:
  push:
    branches: [main, qa, develop]
  pull_request:
    branches: [main, qa, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm i
      - run: npm test

  docker:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/wayces-server:${{ github.ref_name }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wayces-server:${{ github.ref_name }}

  deploy:
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qa')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          script: |
            if [ "${{ github.ref_name }}" = "main" ]; then
              CDIR="/var/www/docker_wayces"
              PNAME="waycess"
            else
              CDIR="/var/www/docker_wayces_qa"
              PNAME="waycess-qa"
            fi
            cd "$CDIR"
            BRANCH=${{ github.ref_name }} docker compose -p $PNAME -f docker-compose.yml pull server
            BRANCH=${{ github.ref_name }} docker compose -p $PNAME -f docker-compose.yml up -d server
            docker image prune -f