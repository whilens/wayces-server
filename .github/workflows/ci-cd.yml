# CI/CD для репозитория wayces-server (отдельный репо).
# Секреты в настройках репо: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
name: CI/CD

on:
  push:
    branches: [main, qa, develop]
  pull_request:
    branches: [main, qa, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm i

  docker:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/wayces-server:${{ github.ref_name }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wayces-server:${{ github.ref_name }}
